<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Generator Kluczy - Paleto</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0b0f14; color: #e6edf3; font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

    @keyframes fadeScaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .generator-box { background: #131822; border: 1px solid #1f2937; border-radius: 10px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: fadeScaleIn 0.3s ease-out; }
    .gen-title { font-family: 'Teko', sans-serif; font-size: 36px; color: #4dd8ff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
    .gen-subtitle { font-size: 12px; color: #7d8590; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
    
    .gen-btn { width: 100%; padding: 14px; background: #4dd8ff; border: none; color: #0b0f14; font-family: 'Teko', sans-serif; font-size: 24px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .gen-btn:hover { background: #3ab1cc; }
    
    .btn-back { display: inline-block; margin-top: 25px; color: #7d8590; font-size: 14px; text-decoration: none; }
    .btn-back:hover { color: #4dd8ff; }
  </style>
</head>
<body>

  <div class="generator-box">
    <div class="gen-title">GENERATOR LICENCJI</div>
    <div class="gen-subtitle">Panel Administratora</div>
    
    <button class="gen-btn" onclick="generateKey()">WYGENERUJ KLUCZ</button>

    <a href="index.html" class="btn-back">◄ Powrót do menu głównego</a>
  </div>

<script>
  // Pobieramy lub tworzymy unikalne ID tego konkretnego urządzenia/przeglądarki
  function getDeviceId() {
    let deviceId = localStorage.getItem('paleto_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now();
      localStorage.setItem('paleto_device_id', deviceId);
    }
    return deviceId;
  }

  async function generateKey() {
    let adminPassInput = prompt("Podaj hasło administratora:");
    if (!adminPassInput) return;

    try {
      const response = await fetch('/api/license', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          action: 'generate', 
          adminPass: adminPassInput,
          deviceId: getDeviceId() 
        })
      });
      const data = await response.json();

      if (data.success) {
        alert("Klucz został pomyślnie wygenerowany i wysłany na Discorda!");
      } else {
        alert(data.message || "Błędne hasło!");
      }
    } catch (e) {
      alert("Błąd połączenia z serwerem.");
    }
  }
</script>

</body>
</html>
