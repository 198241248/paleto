<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Generator Kluczy - Paleto</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0b0f14; color: #e6edf3; font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

    @keyframes fadeScaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .generator-box { background: #131822; border: 1px solid #1f2937; border-radius: 10px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: fadeScaleIn 0.3s ease-out; }
    .gen-title { font-family: 'Teko', sans-serif; font-size: 36px; color: #4dd8ff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
    .gen-subtitle { font-size: 12px; color: #7d8590; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
    
    .gen-btn { width: 100%; padding: 12px; background: #4dd8ff; border: none; color: #0b0f14; font-family: 'Teko', sans-serif; font-size: 22px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-bottom: 15px; }
    .gen-btn:hover { background: #3ab1cc; }
    
    .key-output { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #1f2937; color: #4dd8ff; border-radius: 6px; font-family: monospace; font-size: 18px; text-align: center; margin-top: 10px; word-break: break-all; cursor: pointer; }
    .btn-back { display: inline-block; margin-top: 20px; color: #7d8590; font-size: 14px; text-decoration: none; }
    .btn-back:hover { color: #4dd8ff; }
  </style>
</head>
<body>

  <div class="generator-box">
    <div class="gen-title">GENERATOR LICENCJI</div>
    <div class="gen-subtitle">Panel Administratora</div>
    
    <button class="gen-btn" onclick="generateKey()">WYGENERUJ KLUCZ</button>
    
    <div style="font-size: 12px; color: #7d8590; text-align: left; margin-top: 10px;">Wygenerowany klucz:</div>
    <div class="key-output" id="keyOutput" onclick="copyKey()">Brak klucza</div>

    <a href="index.html" class="btn-back">◄ Powrót do menu głównego</a>
  </div>

<script>
  async function generateKey() {
    let adminPassInput = prompt("");
    if (!adminPassInput) return;

    try {
      const response = await fetch('/api/license', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'generate', adminPass: adminPassInput })
      });
      const data = await response.json();

      if (data.success) {
        document.getElementById('keyOutput').innerText = data.key;
        navigator.clipboard.writeText(data.key);
        alert("Klucz wygenerowany i skopiowany do schowka!");
      } else {
        alert(data.message || "Błędne hasło!");
      }
    } catch (e) {
      alert("Błąd połączenia z serwerem.");
    }
  }

  function copyKey() {
    const keyText = document.getElementById('keyOutput').innerText;
    if (keyText !== "Brak klucza") {
      navigator.clipboard.writeText(keyText);
      alert("Skopiowano klucz do schowka: " + keyText);
    }
  }
</script>

</body>
</html>
